<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Share">
<!-- A plain share glyph on a rounded square: this fork's own drawing for the
     share page's favicon. It is not upstream's brand tile (that art is not
     AGPL, see the repository's ASSETS.md) and carries no mascot or wordmark. -->
<rect x="0" y="0" width="180" height="180" rx="40" fill="#2E3550"/>
<g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
  <line x1="62" y1="72" x2="118" y2="108"/>
  <line x1="118" y1="72" x2="62" y2="108"/>
</g>
<g fill="#FFFFFF">
  <circle cx="56" cy="60" r="20"/>
  <circle cx="124" cy="60" r="20"/>
  <circle cx="90" cy="120" r="20"/>
</g>
</svg>
